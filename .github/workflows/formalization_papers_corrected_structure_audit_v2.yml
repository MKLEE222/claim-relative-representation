name: formalization-papers-corrected-structure-audit-v2

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/formalization_papers_qualified_composition_v1/summarize_fp_corrected_structure_v2.py"
      - ".github/workflows/formalization_papers_corrected_structure_audit_v2.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen parser dependencies
        run: python -m pip install rdflib==7.6.0 pyoxigraph==0.5.11

      - name: Download byte-identical first-opening archive
        run: |
          curl -fL --retry 3 --retry-delay 2             -o /tmp/formalization-papers-v1.0.tar.gz             "https://codeload.github.com/LaraHack/formalization_papers_supplemental/tar.gz/2f68d8498aeeb724e3438deda13e74ae7fb076d8"
          test "$(sha256sum /tmp/formalization-papers-v1.0.tar.gz | awk '{print $1}')" = "c2349aa34350dc5f02f3ad7ccfc1ff6f879e88950fee948b0d5ffa206d4ca9e3"
          rm -rf /tmp/formalization-papers-v1.0
          mkdir -p /tmp/formalization-papers-v1.0
          tar -xzf /tmp/formalization-papers-v1.0.tar.gz             --strip-components=1             -C /tmp/formalization-papers-v1.0

      - name: Reproduce corrected main result
        run: |
          mkdir -p experiments/formalization_papers_qualified_composition_v1/results_structure
          python experiments/formalization_papers_qualified_composition_v1/run_fp_fresh_population_v1.py             --source-root /tmp/formalization-papers-v1.0             --source-archive /tmp/formalization-papers-v1.0.tar.gz             --output experiments/formalization_papers_qualified_composition_v1/results_structure/fp_corrected_main_v2.json

      - name: Summarize corrected structure
        run: |
          python experiments/formalization_papers_qualified_composition_v1/summarize_fp_corrected_structure_v2.py             --main-result experiments/formalization_papers_qualified_composition_v1/results_structure/fp_corrected_main_v2.json             --output experiments/formalization_papers_qualified_composition_v1/results_structure/fp_corrected_structure_audit_v2.json

      - uses: actions/upload-artifact@v4
        with:
          name: formalization-papers-corrected-structure-audit-v2
          path: experiments/formalization_papers_qualified_composition_v1/results_structure
