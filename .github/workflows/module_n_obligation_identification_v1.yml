name: module-n-obligation-identification-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_n_obligation_identification_v1/**"
      - "experiments/module_l_portable_object_claim_v1/**"
      - ".github/workflows/module_n_obligation_identification_v1.yml"
  workflow_dispatch:

jobs:
  synthetic-crossover-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0

      - name: Compile portable and identification engines
        run: |
          python -m py_compile experiments/module_l_portable_object_claim_v1/oracle_l.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/runtime_l.py
          python -m py_compile experiments/module_n_obligation_identification_v1/interventions_n.py
          python -m py_compile experiments/module_n_obligation_identification_v1/evaluator_n.py
          python -m py_compile experiments/module_n_obligation_identification_v1/test_non_substitutability_v1.py
          python -m py_compile experiments/module_n_obligation_identification_v1/run_exposed_identification.py

      - name: Re-run portable controls
        run: python experiments/module_l_portable_object_claim_v1/test_portable_contract_v1.py

      - name: Replay inherited obligations
        run: python experiments/module_l_portable_object_claim_v1/test_inherited_obligations_v1.py

      - name: Run obligation crossover controls
        run: python experiments/module_n_obligation_identification_v1/test_non_substitutability_v1.py

  exposed-identification:
    needs: synthetic-crossover-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0

      - name: Run exposed Berlin Paul StaBi obligation identification
        run: python experiments/module_n_obligation_identification_v1/run_exposed_identification.py

      - uses: actions/upload-artifact@v4
        with:
          name: module-n-obligation-identification-v1
          path: experiments/module_n_obligation_identification_v1/results
