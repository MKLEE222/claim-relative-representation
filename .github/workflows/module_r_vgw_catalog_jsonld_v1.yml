name: module-r-vgw-catalog-jsonld-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_catalog_jsonld_v1.py"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_CATALOG_JSONLD_METADATA_RULE_v1.md"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_HEAD_METADATA_ANCHORS_v1.json"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_LANDING_METADATA_ANCHORS_v1.json"
      - ".github/workflows/module_r_vgw_catalog_jsonld_v1.yml"
  workflow_dispatch:

jobs:
  bounded-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile bounded catalog probe
        run: python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_catalog_jsonld_v1.py

      - name: Read bounded catalog JSON-LD only
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_catalog_jsonld_v1.py
