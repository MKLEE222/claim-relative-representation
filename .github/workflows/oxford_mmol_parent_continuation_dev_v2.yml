name: oxford-mmol-parent-continuation-dev-v2

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/transfer_oxford_mmol_parent_continuation_v1/DEVELOPMENT_EVALUATOR_REPAIR_v1.md"
      - "experiments/transfer_oxford_mmol_parent_continuation_v1/development_v2.py"
      - ".github/workflows/oxford_mmol_parent_continuation_dev_v2.yml"
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install lxml==5.4.0
      - name: Compile
        run: python -m py_compile experiments/transfer_oxford_mmol_parent_continuation_v1/development_v2.py
      - name: Execute corrected Add_A development evaluator
        run: python experiments/transfer_oxford_mmol_parent_continuation_v1/development_v2.py
      - name: Preserve output
        uses: actions/upload-artifact@v4
        with:
          name: oxford-mmol-parent-continuation-add-a-dev-v2
          path: experiments/transfer_oxford_mmol_parent_continuation_v1/results/development_v2_results.json
