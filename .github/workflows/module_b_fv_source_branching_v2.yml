name: module-b-fv-source-branching-v2

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_b_fv_source_branching_v1/run_v2.py"
      - "experiments/module_b_fv_source_branching_v1/EVALUATOR_REPAIR_v2.md"
      - ".github/workflows/module_b_fv_source_branching_v2.yml"
  workflow_dispatch:

jobs:
  run-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install lxml==5.4.0
      - name: Compile
        run: python -m py_compile experiments/module_b_fv_source_branching_v1/run_v2.py
      - name: Execute evaluator-repair reanalysis
        run: python experiments/module_b_fv_source_branching_v1/run_v2.py --download-sources --out experiments/module_b_fv_source_branching_v1/results_v2
      - name: Upload v2 results
        uses: actions/upload-artifact@v4
        with:
          name: module-b-fv-source-branching-v2
          path: |
            experiments/module_b_fv_source_branching_v1/results_v2
            experiments/module_b_fv_source_branching_v1/PROTOCOL.md
            experiments/module_b_fv_source_branching_v1/EVALUATOR_REPAIR_v2.md
            experiments/module_b_fv_source_branching_v1/run_v2.py
