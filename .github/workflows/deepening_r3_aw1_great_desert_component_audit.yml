name: deepening-r3-aw1-great-desert-component-audit-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/R3_AW1_GREAT_DESERT_COMPONENT_AUDIT_v1.md"
      - "experiments/deepening_v1/r3_aw1_great_desert_component_audit_v1.py"
      - ".github/workflows/deepening_r3_aw1_great_desert_component_audit.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run AW1 Great Desert carrier-component audit
        run: python experiments/deepening_v1/r3_aw1_great_desert_component_audit_v1.py
      - name: Upload component audit
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-aw1-great-desert-component-audit-v1
          path: experiments/deepening_v1/results/r3_aw1_great_desert_component_audit_v1.json
          if-no-files-found: error
