name: module-q-aad-exposed-audit-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_q_fresh_erir_v1/AAD_EXPOSED_AUDIT_TRIGGER_v1.txt"

jobs:
  aad-exposed-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install lxml

      - name: Compile AAD exposed audit runner
        run: python -m py_compile experiments/module_q_fresh_erir_v1/run_aad_exposed_audit_v1.py

      - name: Run AAD exposed audit
        run: python experiments/module_q_fresh_erir_v1/run_aad_exposed_audit_v1.py

      - uses: actions/upload-artifact@v4
        with:
          name: module-q-aad-exposed-audit-v1
          path: experiments/module_q_fresh_erir_v1/results
