name: deepening-r3-review-ledger

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/r3_build_review_ledger.py"
      - "experiments/deepening_v1/R3_A_CODING_PROTOCOL.md"
      - ".github/workflows/deepening_r3_review_ledger.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cue-blind R3 review ledger
        run: python experiments/deepening_v1/r3_build_review_ledger.py
      - name: Upload review ledger
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-review-ledger-v1
          path: |
            experiments/deepening_v1/results/r3_inventory_review_ledger_v1.csv
            experiments/deepening_v1/results/r3_inventory_review_ledger_v1_meta.json
          if-no-files-found: error
