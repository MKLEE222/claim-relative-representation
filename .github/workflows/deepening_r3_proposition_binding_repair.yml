name: deepening-r3-proposition-binding-repair-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/R3_PROPOSITION_BINDING_REPAIR_PROTOCOL_v1.md"
      - "experiments/deepening_v1/r3_proposition_binding_repair_v1.py"
      - ".github/workflows/deepening_r3_proposition_binding_repair.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run proposition-binding repair
        run: python experiments/deepening_v1/r3_proposition_binding_repair_v1.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-proposition-binding-repair-v1
          path: experiments/deepening_v1/results/r3_proposition_binding_repair_v1.json
          if-no-files-found: error
