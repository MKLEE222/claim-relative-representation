name: module-r-vgw-head-probe-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_distribution_head_v1.py"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_DISTRIBUTION_DISCOVERY_RULE_v1.md"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_LANDING_METADATA_ANCHORS_v1.json"
      - ".github/workflows/module_r_vgw_head_probe_v1.yml"
  workflow_dispatch:

jobs:
  head-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile HEAD-only probe
        run: python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_distribution_head_v1.py

      - name: Probe distribution via HEAD only
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_distribution_head_v1.py
