name: deepening-r3-great-desert-exact-start-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/R3_GREAT_DESERT_EXACT_START_PROTOCOL_v1.md"
      - "experiments/deepening_v1/r3_great_desert_exact_start_v1.py"
      - ".github/workflows/deepening_r3_great_desert_exact_start.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Great Desert exact-start replication
        run: python experiments/deepening_v1/r3_great_desert_exact_start_v1.py
      - name: Upload exact-start result
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-great-desert-exact-start-v1
          path: experiments/deepening_v1/results/r3_great_desert_exact_start_v1.json
          if-no-files-found: error
