name: formalization-papers-prefresh-synthetic-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/formalization_papers_qualified_composition_v1/**"
      - "audits/mother_problem_redesign_20260929/FORMALIZATION_PAPERS_QUALIFIED_COMPOSITION_PROTOCOL_v1.md"
      - ".github/workflows/formalization_papers_prefresh_synthetic_v1.yml"
  workflow_dispatch:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install independent RDF engines
        run: python -m pip install rdflib pyoxigraph

      - name: Compile Formalization Papers pre-fresh gate
        run: |
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_constants.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_oracle.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_runtime.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/test_fp_prefresh_synthetic_v1.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_population.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/test_fp_population_synthetic_v1.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/run_fp_fresh_population_v1.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_documentary_audit_v1.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_finalize_v1.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/test_fp_authoritative_stack_synthetic_v1.py

      - name: Run Formalization Papers pre-fresh synthetic gate
        run: python experiments/formalization_papers_qualified_composition_v1/test_fp_prefresh_synthetic_v1.py

      - name: Run Formalization Papers population synthetic gate
        run: python experiments/formalization_papers_qualified_composition_v1/test_fp_population_synthetic_v1.py

      - name: Run Formalization Papers authoritative stack synthetic closure
        run: python experiments/formalization_papers_qualified_composition_v1/test_fp_authoritative_stack_synthetic_v1.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formalization-papers-prefresh-synthetic-v1
          path: experiments/formalization_papers_qualified_composition_v1/results
