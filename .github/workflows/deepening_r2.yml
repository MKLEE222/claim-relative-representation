name: deepening-r2-frankenstein-native-replay

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/r2_frankenstein_native_replay.py"
      - ".github/workflows/deepening_r2.yml"
  workflow_dispatch:

jobs:
  r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install native replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-Levenshtein networkx prettytable
      - name: Replay pinned Frankenstein C18 native pipeline
        run: python experiments/deepening_v1/r2_frankenstein_native_replay.py
      - name: Upload machine-readable R2 result
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r2-result
          path: experiments/deepening_v1/results/r2_frankenstein_native_replay.json
          if-no-files-found: error
