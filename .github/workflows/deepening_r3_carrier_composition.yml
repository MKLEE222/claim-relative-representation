name: deepening-r3-carrier-composition-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/r3_carrier_composition_v1.py"
      - "experiments/deepening_v1/R3_CARRIER_COMPOSITION_PROTOCOL_v1.md"
      - ".github/workflows/deepening_r3_carrier_composition.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prospective carrier-composition transfer
        run: python experiments/deepening_v1/r3_carrier_composition_v1.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-carrier-composition-v1
          path: experiments/deepening_v1/results/r3_carrier_composition_v1.json
          if-no-files-found: error
