name: formalization-papers-postfresh-parser-diagnostic-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/formalization_papers_qualified_composition_v1/diagnose_fp_parser_mismatch_v1.py"
      - ".github/workflows/formalization_papers_postfresh_parser_diagnostic_v1.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen parser dependencies
        run: python -m pip install rdflib==7.6.0 pyoxigraph==0.5.11

      - name: Compile diagnostic
        run: |
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_constants.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_oracle.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/fp_runtime.py
          python -m py_compile experiments/formalization_papers_qualified_composition_v1/diagnose_fp_parser_mismatch_v1.py

      - name: Download exact exposed source archive
        run: |
          curl -fL --retry 3 --retry-delay 2             -o /tmp/formalization-papers-v1.0.tar.gz             "https://codeload.github.com/LaraHack/formalization_papers_supplemental/tar.gz/2f68d8498aeeb724e3438deda13e74ae7fb076d8"
          test "$(sha256sum /tmp/formalization-papers-v1.0.tar.gz | awk '{print $1}')" = "c2349aa34350dc5f02f3ad7ccfc1ff6f879e88950fee948b0d5ffa206d4ca9e3"
          rm -rf /tmp/formalization-papers-v1.0
          mkdir -p /tmp/formalization-papers-v1.0
          tar -xzf /tmp/formalization-papers-v1.0.tar.gz             --strip-components=1             -C /tmp/formalization-papers-v1.0

      - name: Run component-level parser diagnostic
        run: |
          mkdir -p experiments/formalization_papers_qualified_composition_v1/results_postfresh
          python experiments/formalization_papers_qualified_composition_v1/diagnose_fp_parser_mismatch_v1.py             --source-root /tmp/formalization-papers-v1.0             --output experiments/formalization_papers_qualified_composition_v1/results_postfresh/fp_parser_diff_diagnostic_v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: formalization-papers-postfresh-parser-diagnostic-v1
          path: experiments/formalization_papers_qualified_composition_v1/results_postfresh
