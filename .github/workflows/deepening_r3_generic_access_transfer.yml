name: deepening-r3-generic-access-transfer-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/R3_GENERIC_ACCESS_TRANSFER_PROTOCOL_v1.md"
      - "experiments/deepening_v1/r3_generic_access_transfer_v1.py"
      - ".github/workflows/deepening_r3_generic_access_transfer.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen R3 generic-access transfer
        run: python experiments/deepening_v1/r3_generic_access_transfer_v1.py
      - name: Upload R3 generic-access result
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-generic-access-transfer-v1
          path: experiments/deepening_v1/results/r3_generic_access_transfer_v1.json
          if-no-files-found: error
