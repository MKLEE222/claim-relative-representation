name: r3-source-witness-round-20260927
on:
  push:
    branches: [audit/cold-start-20260926]
    paths:
      - audits/r3_source_round_20260927/collect_witnesses.py
      - .github/workflows/r3_source_round_20260927.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector syntax before network work
        run: python -m py_compile audits/r3_source_round_20260927/collect_witnesses.py
      - name: Install PDF extraction dependency
        run: python -m pip install PyMuPDF==1.26.4
      - name: Collect bounded page witnesses and text snapshots
        run: python audits/r3_source_round_20260927/collect_witnesses.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-source-witness-round-20260927
          path: audits/r3_source_round_20260927/generated/
          if-no-files-found: error
