name: R3 AW2 Urumtsi native pointer repair
on:
  workflow_dispatch:
  push:
    branches: [audit/cold-start-20260926]
    paths:
      - 'experiments/deepening_v1/R3_AW2_URUMTSI_POINTER_PROTOCOL_v1.md'
      - 'experiments/deepening_v1/r3_aw2_urumtsi_pointer_repair_v1.py'
      - '.github/workflows/deepening_r3_aw2_urumtsi_pointer.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute frozen native-pointer repair
        run: python experiments/deepening_v1/r3_aw2_urumtsi_pointer_repair_v1.py | tee r3_aw2_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r3-aw2-urumtsi-pointer-results
          path: r3_aw2_results.txt
