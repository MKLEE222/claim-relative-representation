name: R3 hierarchical frame v2
on:
  workflow_dispatch:
  push:
    branches: [audit/cold-start-20260926]
    paths:
      - 'experiments/deepening_v1/R3_HIERARCHICAL_FRAME_V1_FAILURE_AND_V2_REPAIR.md'
      - 'experiments/deepening_v1/r3_hierarchical_frame_v2.py'
      - '.github/workflows/deepening_r3_hierarchical_frame_v2.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build repaired hierarchical frame
        run: python experiments/deepening_v1/r3_hierarchical_frame_v2.py | tee hierarchical_frame_v2_stdout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r3-hierarchical-frame-v2
          path: |
            experiments/deepening_v1/results/hierarchical_frame_candidates_v2.csv
            experiments/deepening_v1/results/hierarchical_frame_meta_v2.json
            hierarchical_frame_v2_stdout.txt
