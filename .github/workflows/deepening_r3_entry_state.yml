name: deepening-r3-entry-state-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/r3_fg_entry_state_v1.py"
      - "experiments/deepening_v1/R3_FG_ENTRY_STATE_PROTOCOL_v1.md"
      - "experiments/deepening_v1/r3_fg_transfer_selection_v2.csv"
      - ".github/workflows/deepening_r3_entry_state.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen R3 entry-state transfer
        run: python experiments/deepening_v1/r3_fg_entry_state_v1.py
      - name: Upload R3 entry-state result
        uses: actions/upload-artifact@v4
        with:
          name: deepening-r3-entry-state-v1
          path: experiments/deepening_v1/results/r3_fg_entry_state_v1.json
          if-no-files-found: error
