name: R3 AW1 entry-span evaluator repair
on:
  workflow_dispatch:
  push:
    branches: [audit/cold-start-20260926]
    paths:
      - 'experiments/deepening_v1/R3_AW1_ENTRY_SPAN_REPAIR_MEMO_v2.md'
      - 'experiments/deepening_v1/r3_aw1_entry_span_repair_v2.py'
      - '.github/workflows/deepening_r3_aw1_entry_span_repair.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute entry-span evaluator repair
        run: python experiments/deepening_v1/r3_aw1_entry_span_repair_v2.py | tee r3_aw1_entry_span_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r3-aw1-entry-span-results
          path: r3_aw1_entry_span_results.txt
