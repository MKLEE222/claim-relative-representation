name: module-r-scholarly-assertion-reassessment-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/**"
      - ".github/workflows/module_r_scholarly_assertion_reassessment_v1.yml"
  workflow_dispatch:

jobs:
  synthetic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Module R
        run: |
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/oracle_r.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/runtime_r.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/evaluator_r.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/test_reassessment_contract_v1.py

      - name: Run Module R synthetic reassessment controls
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_reassessment_contract_v1.py
