name: module-j-object-bound-exposed-reaudit-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_j_dahn_object_bound_holdout_v1/**"
      - ".github/workflows/module_j_object_bound_exposed_reaudit_v1.yml"
  workflow_dispatch:

jobs:
  hardening-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - name: Compile inherited and object-bound evaluators
        run: |
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/oracle_v2.py
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/runtime_v2.py
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/evaluator_v2.py
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/test_hardening_v2.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/oracle_j.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/runtime_j.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/evaluator_j.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/test_object_contract_v1.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/run_reaudit.py
      - name: Run inherited F1-F9 hardening tests
        run: python experiments/module_i_dahn_document_boundary_holdout_v1/test_hardening_v2.py
      - name: Run object-bound F10-F12 tests
        run: python experiments/module_j_dahn_object_bound_holdout_v1/test_object_contract_v1.py

  berlin:
    needs: hardening-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - name: Reaudit exposed Berlin corpus
        run: python experiments/module_j_dahn_object_bound_holdout_v1/run_reaudit.py --corpus berlin
      - uses: actions/upload-artifact@v4
        with:
          name: module-j-berlin-reaudit-v1
          path: experiments/module_j_dahn_object_bound_holdout_v1/reaudit_results/berlin

  paul:
    needs: hardening-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - name: Reaudit exposed Paul corpus
        run: python experiments/module_j_dahn_object_bound_holdout_v1/run_reaudit.py --corpus paul
      - uses: actions/upload-artifact@v4
        with:
          name: module-j-paul-reaudit-v1
          path: experiments/module_j_dahn_object_bound_holdout_v1/reaudit_results/paul

  stabi:
    needs: hardening-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - name: Reaudit exposed StaBi corpus
        run: python experiments/module_j_dahn_object_bound_holdout_v1/run_reaudit.py --corpus stabi
      - uses: actions/upload-artifact@v4
        with:
          name: module-j-stabi-reaudit-v1
          path: experiments/module_j_dahn_object_bound_holdout_v1/reaudit_results/stabi
