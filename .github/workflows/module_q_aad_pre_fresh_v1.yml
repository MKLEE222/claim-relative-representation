name: module-q-aad-pre-fresh-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_q_fresh_erir_confirmation_v1/**"
      - ".github/workflows/module_q_aad_pre_fresh_v1.yml"
  workflow_dispatch:

jobs:
  aad-pre-fresh-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen parser dependency
        run: python -m pip install lxml

      - name: Re-run frozen Module P synthetic controls
        run: python experiments/module_p_evidence_release_revision_v1/test_revision_contract_v1.py

      - name: Compile AAD-shaped synthetic gate
        run: python -m py_compile experiments/module_q_fresh_erir_confirmation_v1/test_aad_shaped_synthetic_v1.py

      - name: Run AAD-shaped synthetic gate
        run: python experiments/module_q_fresh_erir_confirmation_v1/test_aad_shaped_synthetic_v1.py
