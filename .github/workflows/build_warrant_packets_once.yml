name: build-warrant-packets-once

on:
  push:
    paths:
      - "experiments/warrant_closure_pm/build_packet.py"
      - ".github/workflows/build_warrant_packets_once.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build anonymous warrant packets
        run: python experiments/warrant_closure_pm/build_packet.py
      - name: Upload packet artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-warrant-packets-v1
          path: experiments/warrant_closure_pm/generated/packets_v1.json
          if-no-files-found: error
