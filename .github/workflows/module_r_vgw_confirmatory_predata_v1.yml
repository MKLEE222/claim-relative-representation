name: module-r-vgw-confirmatory-predata-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/run_vgw_fresh_confirmatory_v1.py"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/audit_vgw_fresh_documentary_v1.py"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/finalize_vgw_fresh_confirmatory_v1.py"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_CONFIRMATORY_EXECUTION_CONTRACT_v1.md"
      - ".github/workflows/module_r_vgw_confirmatory_predata_v1.yml"
  workflow_dispatch:

jobs:
  pre-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen RDF dependency
        run: python -m pip install rdflib==7.1.4

      - name: Verify frozen scientific engine blobs
        run: |
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/vgw_contract_constants.py)" = "acac49b2312131100e3f47d5ac258697cb8e4afc"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/vgw_oracle.py)" = "57796319953fb6639f8789fbf62f81a82e571472"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/vgw_runtime.py)" = "87d63cdbdc4d6c2a59910b57481294a75cd39e7b"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/oracle_r.py)" = "f5cefb84d8957b5e887fd133ef1122213b2419dd"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/runtime_r.py)" = "52ea3ebb788b414036d3f086aa0d51c0dba424f7"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/evaluator_r.py)" = "370b92f3934577af21a318797e75d177ece32097"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_prefresh_synthetic_v1.py)" = "71ed0e6169c74de2fdb136c669820f78ebd8b88a"
          test "$(git hash-object experiments/module_r_scholarly_assertion_reassessment_v1/check_vgw_preopen_source_anchors_v1.py)" = "08219559abd3e19391af898b0e14751aa392f7e1"

      - name: Compile confirmatory execution layer
        run: |
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/run_vgw_fresh_confirmatory_v1.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/audit_vgw_fresh_documentary_v1.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/finalize_vgw_fresh_confirmatory_v1.py

      - name: Re-run frozen Module R synthetic controls
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_reassessment_contract_v1.py

      - name: Re-run VGW-shaped synthetic extraction gate
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_prefresh_synthetic_v1.py

      - name: Re-verify metadata-only source anchors
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/check_vgw_preopen_source_anchors_v1.py
