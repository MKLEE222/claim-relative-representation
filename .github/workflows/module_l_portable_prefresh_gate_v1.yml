name: module-l-portable-prefresh-gate-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_l_portable_object_claim_v1/**"
      - ".github/workflows/module_l_portable_prefresh_gate_v1.yml"
  workflow_dispatch:

jobs:
  synthetic-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - name: Compile inherited and portable engines
        run: |
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/oracle_v2.py
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/runtime_v2.py
          python -m py_compile experiments/module_i_dahn_document_boundary_holdout_v1/evaluator_v2.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/oracle_j.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/runtime_j.py
          python -m py_compile experiments/module_j_dahn_object_bound_holdout_v1/evaluator_j.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/oracle_l.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/runtime_l.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/evaluator_l.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/test_portable_contract_v1.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/run_exposed_regression.py
      - name: Run inherited F1-F9 hardening
        run: python experiments/module_i_dahn_document_boundary_holdout_v1/test_hardening_v2.py
      - name: Run inherited F10-F16 object contract
        run: python experiments/module_j_dahn_object_bound_holdout_v1/test_object_contract_v1.py
      - name: Run portable F17-F27 controls
        run: python experiments/module_l_portable_object_claim_v1/test_portable_contract_v1.py

  exposed-regression:
    needs: synthetic-contract-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0
      - name: Re-run exposed Berlin Paul StaBi with portable engine
        run: python experiments/module_l_portable_object_claim_v1/run_exposed_regression.py
      - uses: actions/upload-artifact@v4
        with:
          name: module-l-portable-exposed-regression-v1
          path: experiments/module_l_portable_object_claim_v1/results
