name: validate-research-contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CEDL research contract
        run: python validation/validate_object.py
      - name: Test controlled representation interventions
        run: |
          cd validation
          python -m unittest -v test_interventions.py

      - name: Run Experiment 1A residual-cue leakage audit
        run: python experiments/exp1_residual_cue_leakage/run.py

      - name: Validate task-adapted design v2
        run: python validation/validate_design_v2.py

      - name: Validate interaction preregistration v1
        run: python validation/validate_interactions_v1.py

      - name: Test interaction representation construction
        run: |
          cd validation
          python -m unittest -v test_interaction_construction.py

      - name: Run paper-money interaction dry-run probe
        run: python experiments/pilot_p0_pm_interactions/run.py

      - name: Validate ecological anchoring and claim ceilings
        run: python validation/validate_ecological_v1.py

      - name: Run Ecological Anchor E1 paper-money access test
        run: python experiments/ecological_anchor_e1_papermoney/run.py

      - name: Run Ecological Anchor E1D retrieval-policy diagnostic
        run: python experiments/ecological_anchor_e1d_retrieval_policy/run.py

      - name: Run Ecological Anchor E1W sequence-guided workflow
        run: python experiments/ecological_anchor_e1w_sequence_guided/run.py

      - name: Validate holdout construction and external selection
        run: python validation/validate_holdouts_v1.py

      - name: Validate external DH material portfolio
        run: python validation/validate_external_dh_v1.py

      - name: Run Frankenstein X1A static external audit
        run: python experiments/external_x1_frankenstein_static/run.py

      - name: Run Whitman X2A relation-certainty audit
        run: python experiments/external_x2_whitman_static/run.py
      - name: Run Faust X3A temporal-provenance audit
        run: python experiments/external_x3_faust_static/run.py

      - name: Run Whitman X2B certainty projection
        run: python experiments/external_x2b_whitman_cert_projection/run.py
      - name: Run Faust X3B source-locator projection
        run: python experiments/external_x3b_faust_source_projection/run.py

      - name: Run Frankenstein X1B sealed C17 holdout
        run: python experiments/external_x1b_frankenstein_holdout/run.py

      - name: Run Whitman X2C printed-locus task audit
        run: python experiments/external_x2c_whitman_task/run.py
      - name: Run Faust X3C published conflict graph audit
        run: python experiments/external_x3c_faust_conflict_graph/run.py

      - name: Run Faust X3D raw assertion conflict ecology
        run: python experiments/external_x3d_faust_raw_conflicts/run.py

      - name: Run Kinsay EP_KS_01 generic access transfer
        run: python experiments/ep_ks_01_access_transfer/run.py

      - name: Run Kinsay EP_KS_01D native referent bridge diagnostic
        run: python experiments/ep_ks_01d_native_referent_bridge/run.py

      - name: Run Kinsay EP_KS_01D2 native referent bridge repair
        run: python experiments/ep_ks_01d2_native_referent_bridge/run.py

      - name: Validate source-grounded mediation contract
        run: python validation/validate_mediation_v1.py
      - name: Run coal EP_CL_01 local-attachment boundary
        run: python experiments/ep_cl_01_boundary/run.py

      - name: Run Scrivener EP_EXT_01 pointer holdout
        run: python experiments/ep_ext_01_scrivener_pointer/run.py
