name: validate-research-contract

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CEDL research contract
        run: python validation/validate_object.py
      - name: Test controlled representation interventions
        run: |
          cd validation
          python -m unittest -v test_interventions.py
