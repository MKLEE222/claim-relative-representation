name: build-final-warrant-packets

on:
  push:
    paths:
      - "experiments/warrant_closure_final/build_packets.py"
      - ".github/workflows/build_final_warrant_packets.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exact deduplicated final packets
        run: python experiments/warrant_closure_final/build_packets.py
      - name: Upload judge-visible packet bundle
        uses: actions/upload-artifact@v4
        with:
          name: pm-final-judge-bundle-v2
          path: experiments/warrant_closure_final/generated/judge_bundle_v2.json
          if-no-files-found: error
      - name: Upload audit-only manifest
        uses: actions/upload-artifact@v4
        with:
          name: pm-final-audit-manifest-v2
          path: experiments/warrant_closure_final/generated/audit_manifest_v2.json
          if-no-files-found: error
