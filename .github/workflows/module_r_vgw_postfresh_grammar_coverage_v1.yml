name: module-r-vgw-postfresh-grammar-coverage-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/VGW_POSTFRESH_GRAMMAR_AUDIT_TRIGGER_v1.txt"

jobs:
  grammar-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run blank-node terminator regression
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_runtime_nt_terminator_regression_v1.py

      - name: Run LANGTAG terminator regression
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_runtime_langtag_terminator_regression_v1.py

      - name: Run full post-fresh N-Triples grammar coverage audit
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/diagnose_vgw_nt_grammar_coverage_v1.py
