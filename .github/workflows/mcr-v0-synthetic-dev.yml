name: mcr-v0-synthetic-dev

on:
  push:
    branches:
      - dh-llm-claim-conditioned-representation-v0-20261010
    paths:
      - "mcr_v0/**"
      - "experiments/mcr_v0/**"
      - ".github/workflows/mcr-v0-synthetic-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcr-structural-dev-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run MCR preregistered synthetic-only tests
        run: python -m unittest -v mcr_v0.test_mcr
      - name: Demonstrate bounded LLM-facing context against equal-source baselines
        run: python -m mcr_v0.demo
      - name: Print evidence ceiling
        run: |
          echo "MCR_V0_EVIDENCE_CLASS=SYNTHETIC_DEV"
          echo "HUMAN_JUDGMENT=NOT_OBTAINED"
          echo "LLM_MODEL_COMPARISON=NOT_RUN"
          echo "OLD_FROZEN_LLM_JUDGE=NEGATIVE_UNCHANGED"
          echo "NO_NATIVE_HOLDOUT_CONSUMED=TRUE"
