name: module-p-evidence-release-revision-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_p_evidence_release_revision_v1/**"
      - ".github/workflows/module_p_evidence_release_revision_v1.yml"
  workflow_dispatch:

jobs:
  synthetic-revision-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0

      - name: Compile Module P
        run: |
          python -m py_compile experiments/module_p_evidence_release_revision_v1/oracle_p.py
          python -m py_compile experiments/module_p_evidence_release_revision_v1/runtime_p.py
          python -m py_compile experiments/module_p_evidence_release_revision_v1/evaluator_p.py
          python -m py_compile experiments/module_p_evidence_release_revision_v1/test_revision_contract_v1.py

      - name: Re-run portable F17-F36 controls
        run: |
          python experiments/module_l_portable_object_claim_v1/test_portable_contract_v1.py
          python experiments/module_l_portable_object_claim_v1/test_iso_datetime_portability_v1.py

      - name: Replay inherited scientific obligations
        run: python experiments/module_l_portable_object_claim_v1/test_inherited_obligations_v1.py

      - name: Re-run strong comparator control
        run: python experiments/module_m_dh_comparators_v1/test_comparators_v1.py

      - name: Re-run obligation crossover control
        run: python experiments/module_n_obligation_identification_v1/test_non_substitutability_v1.py

      - name: Run Module P synthetic revision controls
        run: python experiments/module_p_evidence_release_revision_v1/test_revision_contract_v1.py
