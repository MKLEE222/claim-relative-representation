name: module-m-dh-comparators-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_m_dh_comparators_v1/**"
      - "experiments/module_l_portable_object_claim_v1/**"
      - ".github/workflows/module_m_dh_comparators_v1.yml"
  workflow_dispatch:

jobs:
  comparator-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0

      - name: Compile portable and comparator engines
        run: |
          python -m py_compile experiments/module_l_portable_object_claim_v1/oracle_l.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/runtime_l.py
          python -m py_compile experiments/module_l_portable_object_claim_v1/evaluator_l.py
          python -m py_compile experiments/module_m_dh_comparators_v1/comparators_m.py
          python -m py_compile experiments/module_m_dh_comparators_v1/evaluator_m.py
          python -m py_compile experiments/module_m_dh_comparators_v1/test_comparators_v1.py
          python -m py_compile experiments/module_m_dh_comparators_v1/run_exposed_comparators.py

      - name: Re-run portable F17-F30 controls
        run: python experiments/module_l_portable_object_claim_v1/test_portable_contract_v1.py

      - name: Replay inherited obligations on portable engine
        run: python experiments/module_l_portable_object_claim_v1/test_inherited_obligations_v1.py

      - name: Run strong-baseline and indistinguishability controls
        run: python experiments/module_m_dh_comparators_v1/test_comparators_v1.py

  exposed-comparator-study:
    needs: comparator-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==5.4.0

      - name: Run exposed Berlin Paul StaBi comparator study
        run: python experiments/module_m_dh_comparators_v1/run_exposed_comparators.py

      - uses: actions/upload-artifact@v4
        with:
          name: module-m-dh-comparators-v1
          path: experiments/module_m_dh_comparators_v1/results
