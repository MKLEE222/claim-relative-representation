name: deepening-r3-independent-review-bundle-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/deepening_v1/R3_SECOND_PASS_REVIEW_BUNDLE_PROTOCOL_v1.md"
      - "experiments/deepening_v1/build_r3_second_pass_review_bundle_v1.py"
      - ".github/workflows/deepening_r3_second_pass_review_bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bundle builder
        run: python -m py_compile experiments/deepening_v1/build_r3_second_pass_review_bundle_v1.py
      - name: Install PDF renderer
        run: python -m pip install PyMuPDF==1.26.4
      - name: Build blinded source bundle
        run: python experiments/deepening_v1/build_r3_second_pass_review_bundle_v1.py
      - name: Upload blinded review bundle
        uses: actions/upload-artifact@v4
        with:
          name: r3-independent-second-pass-review-bundle-v1
          path: experiments/deepening_v1/reviewer_bundle_v1/
          if-no-files-found: error
