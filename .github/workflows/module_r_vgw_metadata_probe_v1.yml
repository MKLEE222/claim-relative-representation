name: module-r-vgw-metadata-probe-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_catalog_metadata_v1.py"
      - ".github/workflows/module_r_vgw_metadata_probe_v1.yml"
  workflow_dispatch:

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile metadata probe
        run: python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_catalog_metadata_v1.py

      - name: Probe catalog landing pages only
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/probe_vgw_catalog_metadata_v1.py
