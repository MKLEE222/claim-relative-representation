name: module-f-urumtsi-published-erratum-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_f_urumtsi_published_erratum_v1/**"
      - ".github/workflows/module_f_urumtsi_published_erratum_v1.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install PyMuPDF==1.26.4
      - name: Compile
        run: python -m py_compile experiments/module_f_urumtsi_published_erratum_v1/run.py
      - name: Execute frozen published-erratum transfer
        run: python experiments/module_f_urumtsi_published_erratum_v1/run.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: module-f-urumtsi-published-erratum-v1
          path: |
            experiments/module_f_urumtsi_published_erratum_v1/results
            experiments/module_f_urumtsi_published_erratum_v1/PROTOCOL.md
            experiments/module_f_urumtsi_published_erratum_v1/run.py
