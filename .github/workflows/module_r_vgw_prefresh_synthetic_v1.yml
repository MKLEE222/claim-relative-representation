name: module-r-vgw-prefresh-synthetic-v1

on:
  push:
    branches:
      - audit/cold-start-20260926
    paths:
      - "experiments/module_r_scholarly_assertion_reassessment_v1/vgw_*.py"
      - "experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_prefresh_synthetic_v1.py"
      - ".github/workflows/module_r_vgw_prefresh_synthetic_v1.yml"
  workflow_dispatch:

jobs:
  vgw-prefresh-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RDF dependency
        run: python -m pip install rdflib==7.1.4

      - name: Compile VGW extractors and gate
        run: |
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/vgw_contract_constants.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/vgw_oracle.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/vgw_runtime.py
          python -m py_compile experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_prefresh_synthetic_v1.py

      - name: Re-run frozen Module R synthetic controls
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_reassessment_contract_v1.py

      - name: Run VGW pre-fresh synthetic gate
        run: python experiments/module_r_scholarly_assertion_reassessment_v1/test_vgw_prefresh_synthetic_v1.py
